version: '3.8'

services:
  supernode:
    build:
      context: .
      dockerfile: supertorrent/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - NODE_ENV=production
    restart: always

  zk-service:
    build:
      context: .
      dockerfile: proof-of-play/Dockerfile
    volumes:
      - ./proof-of-play:/app
    # Override CMD to run the server instead of just building
    # We must ensure the ELF is built first.
    # For dev, we can chain commands: build program -> run script/server
    command: >
      bash -c "
        cd program && cargo prove build --output-directory elf &&
        cd ../script && cargo run --release
      "
    ports:
      - "8080:8080"
    restart: on-failure

  game-server:
    build:
      context: .
      dockerfile: game-server/Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - ZK_SERVICE_URL=http://zk-service:8080
    depends_on:
      - supernode
      - zk-service
    restart: always

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5174:5173"
    environment:
      - VITE_API_URL=http://localhost:3001
      - VITE_SUPERNODE_API_URL=http://localhost:8081
