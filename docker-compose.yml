version: '3.8'

services:
  supernode:
    build:
      context: .
      dockerfile: supertorrent/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    restart: always

  game-server:
    build:
      context: .
      dockerfile: game-server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - supernode

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
