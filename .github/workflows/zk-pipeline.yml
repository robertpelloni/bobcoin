name: ZK Production Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install SP1 Toolchain
      # Pin the version and pass the workflow token: unpinned `sp1up`
      # queries api.github.com unauthenticated and dies on rate limits
      # (observed in run 44049752373 and locally).
      run: |
        curl -L https://sp1up.succinct.xyz | bash
        export PATH="$HOME/.sp1/bin:$PATH"
        sp1up -v v6.10.0 -t ${{ secrets.GITHUB_TOKEN }}

    - name: Build SP1 ZK Circuits (Proof of Play)
      working-directory: proof-of-play/program
      run: |
        export PATH="$HOME/.sp1/bin:$PATH"
        cargo prove build

    - name: Build WASM Commitment Client
      working-directory: proof-of-play/wasm
      run: |
        cargo install wasm-pack
        wasm-pack build --target web --out-dir ../../frontend/src/wasm

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        # go.mod files require 1.26.1; 1.22 (previous pin) could never build.
        go-version: '1.26'

    - name: Run Go Test Suites
      run: |
        (cd go-lattice && go test ./...)
        (cd go-game-server && go test ./...)
        (cd go-supertorrent && go test ./...)
        (cd go-casino && go test ./...)

    - name: Run E2E Test Suite (Dual Consensus Parity)
      run: |
        npm install
        cd bobcoin-consensus && npm install && cd ..
        node test_e2e_governance.cjs
