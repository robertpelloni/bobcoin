name: ZK Production Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        target: wasm32-unknown-unknown

    - name: Install Node
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Build SP1 ZK Circuits (Proof of Play)
      working-directory: proof-of-play/program
      run: cargo prove build

    - name: Build WASM Verification Client
      working-directory: proof-of-play/wasm
      run: |
        cargo install wasm-pack
        wasm-pack build --target web --out-dir ../../frontend/src/wasm

    - name: Install Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Run E2E Test Suite (Dual Consensus Parity)
      run: |
        npm install
        cd bobcoin-consensus && npm install && cd ..
        node test_e2e_governance.cjs
